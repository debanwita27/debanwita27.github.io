{{- /* One drink glass. .id must be unique on the page (it names the clipPath);
       .which is "sm", "cc" or "both" (the pour button holds both drinks). */ -}}
<svg class="drink" viewBox="0 0 24 24" aria-hidden="true"><defs><clipPath id="{{ .id }}"><path d="M6.3 5.2L8.1 19.6Q8.3 20.8 9.3 20.8H14.7Q15.7 20.8 15.9 19.6L17.7 5.2Z"/></clipPath></defs><g class="glass"><g clip-path="url(#{{ .id }})">
{{- if ne .which "cc" }}<g class="liq liq-sm"><rect x="3" y="13.2" width="18" height="10" fill="#EBA5B1"/><path d="M3 9.4Q7.5 8.5 12 9.4T21 9.4V13.5H3Z" fill="#AEBA62"/><circle cx="10" cy="16.6" r=".75" fill="#C24D63"/><circle cx="13.7" cy="18.5" r=".75" fill="#C24D63"/><circle cx="11.9" cy="14.9" r=".6" fill="#C24D63"/></g>{{ end }}
{{- if ne .which "sm" }}<g class="liq liq-cc"><rect x="3" y="15.4" width="18" height="8" fill="#A8283B"/><path d="M3 8.8Q7.5 8 12 8.8T21 8.8V15.7H3Z" fill="#6A3A22"/><rect x="8.5" y="7.4" width="4.8" height="4.8" rx="1.1" transform="rotate(-14 10.9 9.8)" fill="#F8F1E7" fill-opacity=".4" stroke="#F8F1E7" stroke-width=".8"/></g>{{ end -}}
</g><path class="gl" d="M5.6 4.4L7.5 19.8Q7.7 21.4 9.2 21.4H14.8Q16.3 21.4 16.5 19.8L18.4 4.4"/><path class="gl" d="M5.2 4.6Q12 5.3 18.8 4.3"/><path class="gl" d="M15.9 1.3L13.4 12.2"/></g></svg>
