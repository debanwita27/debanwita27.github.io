{{- with site.Data.projects }}
<div class="proj breathe">
  <svg class="clip" viewBox="-1 -1 20 48" aria-hidden="true"><path d="M11 13V33a2.5 2.5 0 0 1-5 0V8a4.5 4.5 0 0 1 9 0V35a6.5 6.5 0 0 1-13 0V13" fill="none" stroke="var(--clip-ol)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M11 13V33a2.5 2.5 0 0 1-5 0V8a4.5 4.5 0 0 1 9 0V35a6.5 6.5 0 0 1-13 0V13" fill="none" stroke="var(--clip-fill)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <h3>{{ .heading | default "Projects" }}</h3>
  <ul class="plist" id="plist">
    {{- range .items }}
    <li><a href="{{ .url }}"><span class="k">{{ .name }}</span><span class="v">{{ .desc }}{{ with .aside }} <small>{{ . }}</small>{{ end }}</span></a></li>
    {{- end }}
    {{- with .more }}
    <li class="more"><a href="{{ .url }}">{{ .text }}</a></li>
    {{- end }}
  </ul>
</div>
{{- end }}
