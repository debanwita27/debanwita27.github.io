title = "Debanwita Mahato"
baseURL = 'https://debanwita.me/'
languageCode = 'en-us'
theme = "studio-table"

# To enable Google Analytics 4 (gtag.js) provide G-MEASUREMENT_ID below.
# To disable  Google Analytics, simply leave the field empty or remove the next line
googleAnalytics = '' # G-MEASUREMENT_ID


# Enable emojis globally
enableEmoji = true

# No tag pages: tags in front matter only drive the in-page filter on /posts/ (?tag=<name>).
disableKinds = ["taxonomy", "term"]

# set markup.highlight.noClasses=false to enable code highlight
[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true

[menu]
  # About lives on the home page, so it has no menu entry of its own.
  [[menu.main]]
    pageRef="/"
    name = 'home'
    url = '/'
    weight = 10
  [[menu.main]]
    pageRef="posts"
    name = 'posts'
    url = '/posts/'
    weight = 20
  [[menu.main]]
    pageRef="logs"
    name = 'logs'
    url = '/logs/'
    weight = 30

[params]
  sitename = "Debanwita Mahato"
  defaultColor = "dark" # set default color mode: dark or light
  description = "Debanwita Mahato: design engineer, painter, reader. Posts, logs and a few projects."
  themeSwitcher = "pill" # studio-table header switcher: "pill" or "pour"
  genericTags = ["post", "log"] # tags that only name a section; never shown as chips or filter tabs
  resume = "https://drive.google.com/file/d/1smgGhZna8SLpgL-3eDnq7j3EA1eiTI2H/view?usp=sharing"

[params.author]
  avatar = "avatar.jpg" # put the file in assets folder; also ensure that image has same height and width
  # Note: image is not rendered if the resource(avatar image) is not found. No error is displayed.
  intro = "Debanwita Mahato"
  name = "Debanwita Mahato"
  description = "CS grad trying to get a foothold in UI/UX Design and Web Development. I dabble in generative coding for the kicks."
  firstName = "Debanwita"
  role = "Design Engineer 2"
  employer = "Headout"
  employerURL = "https://headout.com"
